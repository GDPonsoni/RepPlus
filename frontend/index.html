<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#DC0000">
    <title>República</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <div class="logo-ring">
                <img id="logo-top" class="logo-top" alt="Logo da República" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100' cy='100' r='95' fill='%23FFD700' stroke='%23000' stroke-width='4'/><rect x='40' y='50' width='120' height='100' fill='%23DC0000'/><text x='100' y='130' font-size='80' font-weight='bold' text-anchor='middle' font-family='Arial' fill='%23FFD700'>B</text><circle cx='75' cy='75' r='15' fill='%23FFF'/><circle cx='125' cy='75' r='15' fill='%23FFF'/><circle cx='75' cy='80' r='8' fill='%23000'/><circle cx='125' cy='80' r='8' fill='%23000'/></svg>">
            </div>
            <button type="button" class="modulo-atual" data-acao="abrir-seletor" aria-label="Trocar de módulo">
                <span class="modulo-atual-texto">
                    <span class="subtitle">República</span>
                    <span class="modulo-atual-nome"><i id="modulo-atual-icone" class="fa-solid fa-house-user"></i> <span id="modulo-atual-nome">Carregando...</span></span>
                </span>
                <i class="fa-solid fa-chevron-down modulo-atual-seta"></i>
            </button>
            <button type="button" class="btn-modulos" data-acao="abrir-seletor" aria-label="Abrir módulos">
                <i class="fa-solid fa-grip"></i><span>Módulos</span>
            </button>
        </div>
    </header>

    <!-- NAVEGAÇÃO (fixa no topo ao rolar): botões gerados a partir dos módulos (js/core/shell.js) -->
    <nav class="nav-tabs">
        <div class="nav-tabs-inner" id="nav-abas"></div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL: cada módulo injeta suas abas e suas seções de configuração -->
    <main class="main-content" id="conteudo"></main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>República · Organização com responsabilidade! 🏠</p>
    </footer>

    <div id="toast-area" class="toast-area" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#DC0000">
    <title>República</title>
    <script>
        // Preferências deste aparelho antes de desenhar a tela (sem piscar claro no tema escuro).
        // A lógica completa e as mudanças ficam em js/core/aparencia.js
        try {
            var prefs = JSON.parse(localStorage.getItem('escala:aparelho') || '{}');
            var escuro = prefs.tema === 'escuro' || (prefs.tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
            document.documentElement.dataset.texto = prefs.texto || 'normal';
        } catch (e) { /* sem armazenamento: tema padrão */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- CABEÇALHO: logo (volta ao Início), nome do módulo atual e, no canto, avisos e menu do usuário -->
    <header class="header">
        <div class="header-content">
            <button type="button" class="logo-ring" data-acao="ir-para" data-rota="inicio" aria-label="Ir para o início">
                <img id="logo-top" class="logo-top" alt="Logo da República" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100' cy='100' r='95' fill='%23FFD700' stroke='%23000' stroke-width='4'/><rect x='40' y='50' width='120' height='100' fill='%23DC0000'/><text x='100' y='130' font-size='80' font-weight='bold' text-anchor='middle' font-family='Arial' fill='%23FFD700'>B</text><circle cx='75' cy='75' r='15' fill='%23FFF'/><circle cx='125' cy='75' r='15' fill='%23FFF'/><circle cx='75' cy='80' r='8' fill='%23000'/><circle cx='125' cy='80' r='8' fill='%23000'/></svg>">
            </button>
            <div class="header-titulo">
                <span class="subtitle" id="nome-republica">República</span>
                <h1 class="modulo-atual-nome"><i id="modulo-atual-icone" class="fa-solid fa-house"></i> <span id="modulo-atual-nome">Carregando...</span></h1>
            </div>
            <div class="header-acoes">
                <button type="button" class="header-btn" data-acao="abrir-avisos" aria-label="Avisos">
                    <i class="fa-solid fa-bell"></i><span id="avisos-contador" class="header-contador" hidden></span>
                </button>
                <button type="button" class="header-btn header-usuario" data-acao="abrir-menu-usuario" aria-label="Menu: moradores, ajustes e conta">
                    <span id="usuario-avatar" class="avatar-mini"><i class="fa-solid fa-user"></i></span>
                </button>
            </div>
        </div>
    </header>

    <div class="app-corpo">
        <!-- MENU LATERAL (computador): módulos, gerado em js/core/shell.js -->
        <nav class="menu-lateral" id="menu-lateral" aria-label="Módulos"></nav>

        <div class="app-conteudo">
            <!-- ABAS do módulo atual (fixas no topo ao rolar) -->
            <nav class="nav-tabs">
                <div class="nav-tabs-inner" id="nav-abas"></div>
            </nav>

            <!-- CONTEÚDO PRINCIPAL: cada módulo injeta suas abas e suas seções de configuração -->
            <main class="main-content" id="conteudo"></main>

            <footer class="footer">
                <p id="rodape-texto">República · Organização com responsabilidade! 🏠</p>
            </footer>
        </div>
    </div>

    <!-- BARRA INFERIOR (celular): Início, módulos principais e "Mais" -->
    <nav class="nav-inferior" id="nav-inferior" aria-label="Módulos"></nav>

    <div id="toast-area" class="toast-area" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
